apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: #{APP_NAME}#-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{APP_NAME}#
  minReplicas: 1  # Mínimo número de réplicas
  maxReplicas: 2  # Máximo número de réplicas
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # Escala cuando el uso de CPU supere el 70%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Escala cuando el uso de memoria supere el 80%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 40  # Espera 40 segundos antes de escalar hacia arriba
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # Espera 300 segundos antes de escalar hacia abajo
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60